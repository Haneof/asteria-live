[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asteria"
version = "0.1.0"
description = "Asteria 星枢 — 数字人实时演播与直播平台"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[project.scripts]
asteria = "asteria.__main__:main"

[tool.setuptools.packages.find]
include = ["asteria*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
